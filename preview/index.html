<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living tree – preview</title>
<style>
  :root {
    --bg: #f4f2ec; --panel: #ffffff; --ink: #23281f; --muted: #6b7266; --line: #e3e0d6;
    --accent: #3f8f3a; --accent-ink: #fff; --chip: #eef3e8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11150f; --panel: #1a1f18; --ink: #e5eadf; --muted: #9aa393; --line: #2b3228; --accent: #6cc04a; --accent-ink: #0d1a0b; --chip: #222a1f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  header { padding: 22px 24px 6px; max-width: 1280px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  main { display: grid; grid-template-columns: 300px 1fr; gap: 20px; padding: 16px 24px 40px; max-width: 1280px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 12px 16px 32px; } header { padding: 18px 16px 4px; } }
  .ui-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .ui-panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
  .ui-field { margin-bottom: 14px; }
  .ui-field label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; }
  .ui-field label span { font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=text], input[type=number], select { width: 100%; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  .ui-row { display: flex; gap: 8px; }
  .ui-row > * { flex: 1; }
  button { font: inherit; font-weight: 600; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.ui-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .ui-presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
  .ui-stage { border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.12); line-height: 0; }
  .ui-stage svg, .ui-stage img { width: 100%; height: auto; display: block; }
  .ui-stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
  .ui-chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
  .ui-chip b { font-variant-numeric: tabular-nums; }
  .ui-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .ui-tabs button[aria-selected=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .ui-note { color: var(--muted); font-size: 13px; margin-top: 14px; }
  .ui-note code { background: var(--chip); padding: 1px 5px; border-radius: 5px; }
  .ui-hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>🌳 Living tree</h1>
  <p>Always full-grown, dressed in the weather outside in Zagreb, by day or by night.</p>
</header>
<main>
  <aside class="ui-panel">
    <h2>Weather</h2>
    <div class="ui-presets">
      <button class="ui-primary" id="live">📡 Live Zagreb</button>
      <button id="dl">⬇ SVG</button>
    </div>
    <div class="ui-field">
      <label for="wx">Sky</label>
      <select id="wx">
        <option value="clear">☀️ Clear</option>
        <option value="partly" selected>⛅ Partly cloudy</option>
        <option value="cloudy">☁️ Overcast</option>
        <option value="fog">🌫️ Fog</option>
        <option value="drizzle">🌦️ Drizzle</option>
        <option value="rain">🌧️ Rain</option>
        <option value="heavy">🌧️ Heavy rain</option>
        <option value="snow">🌨️ Snow</option>
        <option value="storm">⛈️ Thunderstorm</option>
      </select>
    </div>
    <div class="ui-field">
      <label for="temp">Temperature <span id="tempV"></span></label>
      <input id="temp" type="range" min="-15" max="38" value="14">
    </div>
    <div class="ui-field">
      <label for="wind">Wind <span id="windV"></span></label>
      <input id="wind" type="range" min="0" max="70" value="8">
    </div>

    <h2>Look</h2>
    <div class="ui-field">
      <label for="style">Style</label>
      <select id="style">
        <option value="ascii">▓ ASCII / Matrix</option>
        <option value="classic">🌳 Classic</option>
      </select>
    </div>
    <div class="ui-row ui-field">
      <div>
        <label for="season">Season</label>
        <select id="season">
          <option value="auto">Auto (today)</option>
          <option value="spring">Spring</option>
          <option value="summer">Summer</option>
          <option value="autumn">Autumn</option>
          <option value="winter">Winter</option>
        </select>
      </div>
      <div>
        <label for="theme">Day / night</label>
        <select id="theme">
          <option value="time">By the clock (Zagreb)</option>
          <option value="light">Day</option>
          <option value="dark">Night</option>
        </select>
      </div>
    </div>
    <div class="ui-field">
      <label for="login">GitHub user <span>tree shape</span></label>
      <input id="login" type="text" value="josipdom" autocomplete="off">
    </div>
  </aside>

  <section>
    <div class="ui-tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="lab">Lab</button>
      <button role="tab" aria-selected="false" data-tab="file">Generated file</button>
    </div>
    <div id="lab">
      <div class="ui-stage" id="stage"></div>
      <div class="ui-stats" id="stats"></div>
      <p class="ui-note">This is the same code the GitHub Action runs every 30 minutes, except there it uses the real weather. The same user always gets the same tree shape.</p>
    </div>
    <div id="file" class="ui-hidden">
      <div class="ui-stage" id="fileStage"></div>
      <p class="ui-note" id="fileNote"></p>
    </div>
  </section>
</main>

<script type="module">
import { renderTree, FULL_GROWN, seasonOf } from '/src/tree.js';
import { renderAscii } from '/src/ascii.js';
import { themeByTime } from '/src/sun.js';
import { PRESETS, weatherFrom, fetchWeather, weatherLine, DEFAULT_PLACE } from '/src/weather.js';

const $ = (id) => document.getElementById(id);
const themeNow = () => ($('theme').value === 'time' ? themeByTime(new Date()) : $('theme').value);
const hm = () => new Date().toLocaleTimeString('en-GB', { timeZone: DEFAULT_PLACE.tz, hour: '2-digit', minute: '2-digit' });

let live = null;   // live weather object while "Live Zagreb" is active
let lastSvg = '';

function weather() {
  return live || weatherFrom(PRESETS[$('wx').value], { temp: +$('temp').value, wind: +$('wind').value });
}

function render() {
  const wx = weather();
  $('tempV').textContent = `${$('temp').value} °C`;
  $('windV').textContent = `${$('wind').value} km/h`;
  const s = {
    login: $('login').value.trim() || 'github',
    total: FULL_GROWN, active30: 30, sinceLast: 0, streak: 0,
    season: $('season').value, theme: themeNow(), lang: 'en',
    place: DEFAULT_PLACE.name, weather: wx, updated: hm(),
  };
  const t0 = performance.now();
  lastSvg = $('style').value === 'ascii' ? renderAscii(s) : renderTree(s);
  const ms = performance.now() - t0;
  $('stage').innerHTML = lastSvg;
  const season = s.season === 'auto' ? seasonOf(new Date()) : s.season;
  $('stats').innerHTML = [
    ['Weather', (live ? '📡 ' : '') + weatherLine(wx)],
    ['Season', season],
    ['Time', s.theme === 'light' ? 'day' : 'night'],
    ['SVG size', (new Blob([lastSvg]).size / 1024).toFixed(0) + ' KB'],
    ['Render', ms.toFixed(0) + ' ms'],
  ].map(([k, v]) => `<span class="ui-chip">${k}: <b>${v}</b></span>`).join('');
}

for (const id of ['wx', 'temp', 'wind']) {
  $(id).addEventListener('input', () => { live = null; $('live').textContent = '📡 Live Zagreb'; render(); });
}
for (const id of ['style', 'season', 'theme', 'login']) $(id).addEventListener('input', render);

$('live').addEventListener('click', async () => {
  $('live').textContent = '⏳ Loading…';
  const w = await fetchWeather(DEFAULT_PLACE);
  live = w;
  $('live').textContent = w.ok ? '📡 Live ✔' : '📡 Offline';
  if (w.ok) {
    const preset = Object.keys(PRESETS).find((k) => PRESETS[k] === w.code);
    if (preset) $('wx').value = preset;
    if (w.temp != null) $('temp').value = w.temp;
    $('wind').value = w.wind;
  }
  render();
});

$('dl').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lastSvg], { type: 'image/svg+xml' }));
  a.download = $('style').value === 'ascii' ? 'tree-ascii.svg' : 'tree.svg';
  a.click();
});

// tabs
document.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', async () => {
  document.querySelectorAll('[data-tab]').forEach((x) => x.setAttribute('aria-selected', x === b));
  $('lab').classList.toggle('ui-hidden', b.dataset.tab !== 'lab');
  $('file').classList.toggle('ui-hidden', b.dataset.tab !== 'file');
  if (b.dataset.tab === 'file') {
    const theme = themeNow();
    const fileName = $('style').value === 'ascii' ? `tree-ascii-${theme}.svg` : `tree-${theme}.svg`;
    const url = `/dist/${fileName}?${Date.now()}`;
    const ok = (await fetch(url, { method: 'HEAD' })).ok;
    $('fileStage').innerHTML = ok ? `<img src="${url}" alt="${fileName}">` : '';
    $('fileNote').innerHTML = ok
      ? `This is the file <code>dist/${fileName}</code> shown as an &lt;img&gt;, exactly how GitHub shows it in your README.`
      : `No generated file yet. Run <code>node scripts/generate.mjs</code>.`;
  }
}));

render();
</script>
</body>
</html>
