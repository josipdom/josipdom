name: 🌳 Zalij stablo

on:
  schedule:
    - cron: "7,37 * * * *"   # svakih 30 min (dan/noć prati izlazak i zalazak sunca)
  workflow_dispatch:         # ručno pokretanje iz kartice "Actions"
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tree
  cancel-in-progress: true

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generiraj stablo
        run: node scripts/generate.mjs --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          TREE_LANG: hr        # ili: en
          TREE_SEASON: auto    # ili: spring / summer / autumn / winter
          TREE_DAYNIGHT: time  # time = dan/noć po satu, theme = po temi posjetitelja
          TREE_LAT: "45.815"   # lokacija za izlazak/zalazak sunca (Zagreb)
          TREE_LON: "15.982"

      # SVG ide na zasebnu granu "output" da ne zagađuje povijest glavne grane
      - name: Objavi na granu output
        run: |
          cd dist
          git init -q -b output
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "🌳 stablo $(date -u '+%F %H:%M')"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
